# pathxai_agent_v2 default configuration.
#
# Every value here was previously hardcoded or buried in an environment-variable
# default inside the legacy agents / shell scripts. Override any field via:
#   1. a user YAML passed to load_settings(path=...), or
#   2. environment variables (see settings.py ENV_OVERRIDES), or
#   3. keyword args when constructing Settings in code.
#
# Values intentionally mirror the legacy defaults so results stay comparable.

paths:
  project_root: /local/PathXAI_Agent_v2
  shared_artifacts: /local/PathXAI_Agent_v2/shared_artifacts
  outputs_root: /local/PathXAI_Agent_v2/outputs
  v1_src_root: /local/PathXAI_Agent/src
  # Interpreter used for MedSAM subprocess segmentation (separate conda env).
  seg_python: /local/conda_staffs/conda_envs/medsam/bin/python
  # Foundation / pipeline interpreter (CONCH env).
  pipeline_python: /local/conda_staffs/conda_envs/conch/bin/python
  seg_ckpt: /local/PathXAI/medsam3_combined_runs_4096_fusion_fixed_data_fixed2/stage3_ablation_group_d/stage3_ablation_D1/run_20260619_144518_stage3_tissue/best_model.pth
  seg_cache_dir: /local/PathXAI_Agent_v2/shared_artifacts/seg_cache/medsam3_d1
  roi_cache_dir: /local/PathXAI_Agent_v2/shared_artifacts/roi_cache
  llm_cache_dir: /local/PathXAI_Agent_v2/shared_artifacts/llm_cache
  keep_root: /local/datasets/public/KEEP_dataset

llm:
  qwen_api: 127.0.0.1:8000
  qwen_model: qwen
  medgemma_api: 127.0.0.1:8001
  medgemma_model: google/medgemma-4b-it
  # Optional final-report-only writer. Empty means reuse qwen_api/qwen_model for
  # both reasoning stages and final report generation.
  report_api: ""
  report_model: ""
  report_max_tokens: 4096
  read_timeout: 600          # seconds; connect timeout is fixed small in client
  connect_timeout: 10
  max_retries: 2
  retry_backoff: 3.0
  image_max_edge: 768
  image_jpeg_quality: 75
  temperature: 0.2
  max_tokens: 4096

segmentation:
  enabled: true
  device: cuda:0
  patch_size: 4096
  stride: 2048
  max_rois: 11
  use_subprocess: true
  # QC of segmentation overlays.
  qc_max_images: 11
  qc_missing_retries: 2
  qc_cache_version: seg_qc_pair_v2

roi:
  candidate_rois: 20
  selected_rois: 3          # initial ROI budget
  max_site_rois: 3
  llm_triage_candidates: 8
  foundation_model: conch
  foundation_ranking_mode: diagnostic
  foundation_tile_size: 1024
  foundation_mpp: 0.5
  foundation_batch_size: 16

reinspection:
  max_reinspection_rois: 2  # extra ROIs added per round
  max_reinspection_rounds: 4
  max_zoom_depth: 1
  # init 3 + 2 * 4 rounds = 11
  max_final_rois: 11

context_budget:
  medgemma_max_chars: 6000
  segmentation_max_chars: 12000
  knowledge_max_chars: 4000

knowledge:
  enabled: true
  max_disease: 5
  max_semantic_groups: 5
  max_captions_per_hypothesis: 3
  max_children: 5

session:
  memory_version: diagnostic_session_memory_v1

# Data-leakage control. See leakage_guard.py.
#   known_site_from: none | tcga
#     - none : model must predict the organ/site itself (honest, harder).
#     - tcga : site is derived from the TCGA cancer-type label and supplied as a
#              clinical prior. Enables the "known specimen site" scenario.
#              When on, site_accuracy is NOT a valid capability metric.
#   allow_known_cancer_type is intentionally absent: the ground-truth cancer
#   type must never be fed to the agent.
leakage:
  known_site_from: tcga
  min_hypotheses: 3
